// ---- 15_view.js ----
// ===== CranBeasts: views, camera, effects, name tags =====
const RIND_LOOK = { berry: 'blackcurrant', eyes: 'angry', mouth: 'fangs', brows: 'cross', facex: 'none', head: 'sprout', top: 'none', bottom: 'none', extras: 'none' };
const RIND_SKIN = [0.32, 0.2, 0.12];

// ---- view builders ----
function hostView(game) {
  const W = game.world, beasts = [], props = [];
  for (const b of game.beasts) {
    if (b.out) continue;
    const P = new Float32Array(30);
    for (let k = 0; k < 10; k++) { const i = b.idx[k]; P[k * 3] = W.px[i]; P[k * 3 + 1] = W.py[i]; P[k * 3 + 2] = W.pz[i]; }
    beasts.push({
      id: b.id, P,
      vis: { ko: b.ko > 0, hold0: !!(b.hands[0].joint || (b.hands[0].held && b.hands[0].holdT > 0.1)), hold1: !!(b.hands[1].joint || (b.hands[1].held && b.hands[1].holdT > 0.1)), hurt: b.expr === 'hurt', protect: b.protect > 0 && Math.sin(game.time * 20) > 0, daze: b.daze, stamina: b.stamina, escape: b.escape, rind: b.isRind, bruiser: b.bruiser, tags: !!(b.input.btn & BTN.TAGS), scale: b.scale, player: b.player },
    });
  }
  for (const p of game.props) if (p.alive) props.push({ id: p.id, type: p.type, p: p.pos.slice(), q: p.rot.slice(), extra: { fuse: p.fuse } });
  return { A: game.arena, t: game.time, beasts, props, dark: game.lighting.dark };
}
function guestView(sess, A) {
  const s = sess.sample(); if (!s || !A) return null;
  const { a, b, f } = s, beasts = [], props = [];
  for (const [id, sb] of b.beasts) {
    const sa = a.beasts.get(id) || sb, P = new Float32Array(30);
    for (let k = 0; k < 30; k++) P[k] = lerp(sa.P[k], sb.P[k], f);
    const fl = sb.f;
    beasts.push({ id, P, vis: { ko: !!(fl & 1), hold0: !!(fl & 2), hold1: !!(fl & 4), hurt: !!(fl & 8), protect: !!(fl & 16), rind: !!(fl & 32), bruiser: !!(fl & 64), tags: !!(fl & 128), daze: sb.daze, stamina: sb.stam, escape: sb.esc, scale: fl & 64 ? 1.3 : 1 } });
  }
  for (const [id, pb] of b.props) {
    const pa = a.props.get(id) || pb;
    props.push({ id, type: pb.type, p: V3.lerp([0, 0, 0], pa.p, pb.p, f), q: Q.slerp([0, 0, 0, 1], pa.q, pb.q, f), extra: { fuse: pb.fuse } });
  }

    const da = ad.get(d.idx) || d;
    V3.lerp(c.pos, da.p, d.p, f); Q.slerp(c.q, da.q, d.q, f); c.enabled = d.en;
  }
  for (let k = 0; k < 8; k++) A.ns[k] = b.ns[k];

}

// ---- camera ----
const Cam = {
  target: [0, 1, 0], dist: 16, shake: 0, yawOff: 0, eye: [0, 10, -10], fwd: [0, 0, 1], spectate: -1, angle: 0,
  reset(A) { this.target = A.cam.center.slice(); this.target[1] += 1; this.dist = (A.cam.min + A.cam.max) / 2; this.yawOff = 0; this.angle = 0; },
  update(view, dt, opts) {
    const A = view.A, cam = A.cam;
    let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9], n = 0;
    let list = view.beasts;
    if (opts.focus != null) { const fb = list.find((b) => b.id === opts.focus); if (fb) list = [fb]; }
    for (const b of list) {
      const x = b.P[3], y = b.P[4], z = b.P[5];
      if (y < A.killY + 1 || Math.abs(x) > 80 || Math.abs(z) > 80) continue;
      mn[0] = Math.min(mn[0], x); mn[1] = Math.min(mn[1], y); mn[2] = Math.min(mn[2], z);
      mx[0] = Math.max(mx[0], x); mx[1] = Math.max(mx[1], y); mx[2] = Math.max(mx[2], z); n++;
    }
    let tgt, ext;
    if (n) { tgt = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2 + 0.6, (mn[2] + mx[2]) / 2]; ext = Math.max(mx[0] - mn[0], (mx[2] - mn[2]) * 1.3, (mx[1] - mn[1]) * 1.5); }
    else { tgt = [A.cam.center[0], A.cam.center[1] + 1, A.cam.center[2]]; ext = 8; }
    if (A.camFixed) { tgt = A.camFixed.slice(); ext = A.cam.max; }
    if (opts.focus != null && opts.followMe && n) ext = Math.max(ext, 6);
    const zmin = cam.min * (opts.zoomMin || 1), zmax = cam.max * (opts.zoomMax || 1);
    const want = clamp(ext * 1.05 + 6, zmin, zmax);
    const k = 1 - Math.exp(-dt * 3);
    V3.lerp(this.target, this.target, tgt, k);
    this.dist = lerp(this.dist, want, 1 - Math.exp(-dt * 2));
    const yaw = cam.yaw + this.yawOff + this.angle, pitch = cam.pitch;
    const d = this.dist;
    this.eye = [this.target[0] - Math.sin(yaw) * Math.cos(pitch) * d, this.target[1] + Math.sin(pitch) * d, this.target[2] - Math.cos(yaw) * Math.cos(pitch) * d];

    Renderer.cam.eye = this.eye; Renderer.cam.at = this.target; Renderer.cam.fov = cam.fov;
  },

// ---- particles & popups ----
const FX = {

    for (const p of this.parts) {
      const k = clamp(p.life / p.max, 0, 1), s = p.size * (p.kind === 2 ? (1 - k) * 2 + 0.3 : Math.sqrt(k));
      if (p.kind === 1) Rn.add(MESH.STAR, p.p, Q.axisAngle([0, 0, 0, 1], 0, 1, 0, t * 4 + p.spin), [s, s, s], p.col, { emis: 0.6, noShadow: true });
      else Rn.add(MESH.SPHERE, p.p, QI, [s, s, s], p.col, { gloss: 0.8, noShadow: true, alpha: p.kind === 2 ? k * 0.7 : undefined, emis: p.kind === 3 ? 1 : 0 });
    }
  },
  updatePopups(dt) {
    const out = [0, 0, 0];
    for (const pp of this.popups) {
      pp.t += dt;
      if (Renderer.project([pp.p[0], pp.p[1] + pp.t * 0.8, pp.p[2]], out)) {
        pp.el.style.transform = `translate(${out[0]}px,${out[1]}px) translate(-50%,-50%) scale(${pp.t < 0.12 ? pp.t / 0.12 * 1.3 : 1})`;
        pp.el.style.opacity = pp.t > pp.dur - 0.3 ? Math.max(0, (pp.dur - pp.t) / 0.3) : 1;
      }
      if (pp.t > pp.dur) pp.el.remove();
    }
    this.popups = this.popups.filter((p) => p.t <= p.dur);
  },
  clear() { this.parts = []; for (const p of this.popups) p.el.remove(); this.popups = []; },
};

  const { x, y, z } = e, sh = (v) => { Cam.shake = Math.max(Cam.shake, v * (ctx.reduceFlash ? 0.5 : 1)); };
  const pan = 0;

    }

    case 'ko': Sound.play('ko'); FX.popup(x, y + 0.6, z, 'KNOCKED OUT!', 'ko', 1.3); if (ctx.announce && Math.random() < 0.6) Sound.say('Knocked out!'); sh(0.4); break;

      const txt = ELIM_TEXT[e.b] || 'SPLAT!'; FX.popup(x, y + 1, z, txt, 'elim', 1.3); sh(0.7);
      if (ctx.onElim) ctx.onElim(e.a, e.b); break;

    case 'pop': Sound.play('pop'); FX.burst(x, y, z, 40, [0.95, 0.2, 0.05], 8, 0.15, 1, -8); FX.popup(x, y + 1, z, 'KA-POP!', 'big'); sh(1); break;
    case 'wave': Sound.play('wave'); if (ctx.banner) ctx.banner('WAVE ' + e.a, '#ff7a1a'); if (ctx.announce) Sound.say('Wave ' + e.a); break;
    case 'waveset': Sound.play('waveset'); if (ctx.banner) ctx.banner('Everyone back in!', '#2fbf4a'); break;

// ---- name tags & speech bubbles (DOM) ----
const Tags = {
  layer: null, els: new Map(), bubbles: new Map(),
  init(layer) { this.layer = layer; },
  update(view, players, show, big, myIds) {
    const seen = new Set(), out = [0, 0, 0];
    for (const b of view.beasts) {
      const p = b.vis.player || players.find((x) => x.id === b.id);
      const visible = show || b.vis.tags || this.bubbles.has(b.id) || (b.vis.escape > 0.05);
      if (!visible || b.vis.rind) continue;
      if (!Renderer.project([b.P[0], b.P[1] + 0.85, b.P[2]], out)) continue;
      let el = this.els.get(b.id);
      if (!el) { el = document.createElement('div'); el.className = 'tag'; this.layer.appendChild(el); this.els.set(b.id, el); }
      const bub = this.bubbles.get(b.id);
      const name = p ? p.name : '?', col = p ? PLAYER_COLORS[p.color % 8] : '#888';
      const key = name + col + (bub ? bub.text : '') + (big ? 'B' : '') + (b.vis.escape > 0.05 ? Math.round(b.vis.escape * 10) : '') + (myIds && myIds.includes(b.id) ? 'me' : '');
      if (el._k !== key) {
        el._k = key;
        el.className = 'tag' + (big ? ' big' : '');
        el.innerHTML = (bub ? `<div class="bubble">${esc(bub.text)}</div>` : '') + `<span style="background:${col}">${esc(name)}${myIds && myIds.includes(b.id) ? ' ★' : ''}</span>` + (b.vis.escape > 0.05 ? `<div class="esc"><i style="width:${Math.round(b.vis.escape * 100)}%"></i></div>` : '');
      }
      el.style.transform = `translate(${out[0]}px,${out[1]}px) translate(-50%,-100%)`;
      el.style.display = '';
      seen.add(b.id);
    }
    for (const [id, el] of this.els) if (!seen.has(id)) el.style.display = 'none';
    const t = now(); for (const [id, bb] of this.bubbles) if (t > bb.until) this.bubbles.delete(id);
  },
  say(id, text) { this.bubbles.set(id, { text, until: now() + 2.8 }); },
  clear() { for (const el of this.els.values()) el.remove(); this.els.clear(); this.bubbles.clear(); },
};

// ---- draw a full scene ----
const beastCache = new Map();
function drawScene(view, players, t, dt, opts = {}) {
  const A = view.A, env = Renderer.env;
  Object.assign(env, { skyTop: A.env.skyTop, skyBot: A.env.skyBot, fog: A.env.fog, sky: A.env.sky, gnd: A.env.gnd, sunCol: A.env.sunCol, fogNear: A.env.fogNear, fogFar: A.env.fogFar });
  env.sun = V3.norm([0, 0, 0], A.env.sun);
  env.dark = Math.max(A.env.dark || 0, view.dark || 0);
  env.shadowCenter = A.shadow.c; env.shadowRadius = A.shadow.r;
  Renderer.begin(t);
  drawArena(Renderer, A, t);
  for (const b of view.beasts) {
    let c = beastCache.get(b.id); if (!c) { c = {}; beastCache.set(b.id, c); }
    const p = b.vis.player || players.find((x) => x.id === b.id);
    const vis = Object.assign({}, b.vis);
    if (b.vis.rind) { vis.look = RIND_LOOK; vis.skin = b.vis.bruiser ? [0.25, 0.12, 0.08] : RIND_SKIN; vis.color = 5; }
    else { vis.look = p ? p.look : DEFAULT_LOOK; vis.color = p ? p.color : 0; if (p && opts.teams && p.team != null) vis.color = p.team; }
    drawBeast(Renderer, b.P, vis, c, t, dt, { outline: opts.outlines && !b.vis.rind ? hexToRgb(CB_OUTLINES[vis.color % 8]) : null, jiggle: opts.jiggle });
  }
  for (const pr of view.props) drawProp(Renderer, pr.type, pr.p, pr.q, t, pr.extra);
  FX.draw(Renderer, t);
  if (opts.extra) opts.extra(Renderer);
  Renderer.render();
}

  nav(dir) {
    const f = this.focusables(); if (!f.length) return;
    let i = f.indexOf(document.activeElement);
    if (i < 0) { f[0].focus(); return; }
    const cur = f[i].getBoundingClientRect(), cx = cur.left + cur.width / 2, cy = cur.top + cur.height / 2;
    let best = null, bd = 1e9;
    for (const el of f) {
      if (el === f[i]) continue;
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - cx, dy = y - cy;
      const ok = dir === 'left' ? dx < -4 : dir === 'right' ? dx > 4 : dir === 'up' ? dy < -4 : dy > 4;
      if (!ok) continue;
      const d = (dir === 'left' || dir === 'right') ? Math.abs(dx) + Math.abs(dy) * 2.5 : Math.abs(dy) + Math.abs(dx) * 2.5;
      if (d < bd) { bd = d; best = el; }
    }
    if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
  },
  activate() { const a = document.activeElement; if (a && this.el.contains(a)) { if (a.tagName === 'INPUT' && a.type === 'text') return; a.click(); } },
  back() { const b = this.el.querySelector('[data-back]'); if (b) b.click(); },
};

  },

    return out;
  },

    const s = SHOP.find((x) => x.slot === slot && x.id === id); if (!s) return false;
    const price = TIER_PRICE[s.tier]; if (this.data.jam < price || this.data.owned[slot + ':' + id]) return false;

  addBots() {

  startMatch() {

}

  } catch (e) {}
}
